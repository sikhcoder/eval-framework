[project]
name = "ef-cli"
version = "0.1.0"
description = "The ef command-line interface."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["ef-core", "ef-sandbox", "ef-verify", "ef-runner", "ef-redteam", "ef-export", "typer>=0.15", "rich>=13.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ef"]

[project.scripts]
ef = "ef.cli.main:app"
