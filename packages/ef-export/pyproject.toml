[project]
name = "ef-export"
version = "0.1.0"
description = "Exporters to Inspect AI, verifiers, METR, OpenAI evals."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["ef-core", "ef-verify"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ef"]
