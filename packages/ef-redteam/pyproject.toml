[project]
name = "ef-redteam"
version = "0.1.0"
description = "Adversarial reward-hack policies and gameability report."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["ef-core", "ef-sandbox", "ef-verify", "ef-runner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ef"]
