[project]
name = "ef-runner"
version = "0.1.0"
description = "Rollout engine and agent adapters."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["ef-core", "ef-sandbox", "ef-verify"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ef"]
