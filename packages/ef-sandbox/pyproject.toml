[project]
name = "ef-sandbox"
version = "0.1.0"
description = "Sandbox protocol and backends (Docker, local, E2B)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["ef-core", "docker>=7.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ef"]
