[project]
name = "ef-verify"
version = "0.1.0"
description = "Verifier protocol and tier 0-3 scoring primitives."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["ef-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ef"]
