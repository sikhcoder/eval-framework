[project]
name = "ef-pack-demo"
version = "0.1.0"
description = "Public toy pack proving the plugin API end to end."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["ef-core", "ef-verify", "ef-sandbox"]

[project.entry-points."ef.packs"]
demo = "ef_pack_demo:PACK"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ef_pack_demo"]
